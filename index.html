ed bypassing referendum."},"HB 1912":{"classification":"genuine","reasoning":"Near-unanimous bipartisan vote (94-2, 49-0); establishes CCA tracking and reporting obligations that take effect January 1, 2026 — the immediate effect is needed to allow fuel sellers time to register by December 2025, with no opposition on the core issue."},"HB 1936":{"classification":"genuine","reasoning":"Unanimous/near-unanimous bipartisan vote (97-0, 47-2); prevents the July 1, 2025 expiration of the provision allowing retired school employees to work up to 1,040 hours without pension interruption — a hard statutory deadline."},"HB 1970":{"classification":"weak","reasoning":"Near-unanimous vote (97-0, 48-1) authorizing WSDOT to use design-build and GC/CM contracting immediately — while aligning with the fiscal year makes sense, procurement methods for highway projects don't require emergency bypass of referendum; classified weak because the subject is genuinely procedural but the urgency rationale is thin."},"HB 1990":{"classification":"genuine","reasoning":"Broadly bipartisan final vote (93-4, 45-3); creates a disaster-cost securitization mechanism for utilities contingent on June 30, 2025 budget appropriation — a genuine fiscal deadline tied to an existing wildfire-disaster recovery need."},"HB 2077":{"classification":"shield","reasoning":"Close, mostly party-line vote (52-45, 28-19) imposing new excise taxes on ZEV credit transactions; Tesla and auto industry organized opposition, no time-sensitive deadline — the EC prevents referendum on a novel tax-policy mechanism."},"HB 2081":{"classification":"shield","reasoning":"Narrow party-line vote (50-48, 26-22) imposing sweeping B&O tax rate increases across dozens of business categories with massive organized business opposition; key provisions don't take effect until January 2027 — the EC on a bill with future effective dates is a textbook shield."},"HB 2215":{"classification":"weak","reasoning":"Initially party-line in House (57-38) igibility expansions, with MomsRising, SEIU 925, and child care advocates in organized opposition — the EC prevents referendum on a politically unpopular benefit reduction."},"HB 2711":{"classification":"genuine","reasoning":"Initially bipartisan (83-10); the EC applies only to specific fiscal and tax-distribution provisions tied to the June 30/July 1, 2025 fiscal year start — a genuine budget-execution need, even if the final vote was narrower."},"SB 5068":{"classification":"shield","reasoning":"Mostly party-line (28-19, 62-33) allowing non-citizen lawful permanent residents to serve as police officers, prosecutors, and firefighters; Republicans unanimously opposed this immigration-adjacent policy change and the EC prevents referendum on a genuinely controversial eligibility shift."},"SB 5079":{"classification":"genuine","reasoning":"Unanimous bipartisan vote (49-0, 93-2); waives collection of unintentional government overpayments to disabled/elderly clients effective July 1, 2025, preventing financial harm to vulnerable recipients — aligns with a fiscal deadline and no opposition."},"SB 5104":{"classification":"weak","reasoning":"House was party-line (59-38) though Senate had 8 Republican crossovers (40-9); protects workers from immigration-status threats, effective July 1, 2025 — while the subject matter involves real worker vulnerability, the EC is arguably an effort to lock in policy before political conditions change rather than respond to a genuine emergency."},"SB 5161":{"classification":"genuine","reasoning":"Strongly bipartisan final vote (80-18, 34-13); the biennial transportation budget is a fiscal instrument that must be operational at the start of the biennium — standard for budget bills to carry emergency clauses."},"SB 5167":{"classification":"genuine","reasoning":"Despite mostly party-line passage (52-45, 28-19), the operating budget is the foundational state spending bill for the 2025-27 biennium; immediate effect is genuinely necessary for state government to function from July 1, 2025."},"SB 5175":{"classification":"weak","reasoning":"Senate unanimous (49-0) but House party-line (58-37); delays prior statutory deadlines for solar-panel recycling programs before they take effect June 30, 2025 — there is a real deadline but the EC also prevents voters from challenging a Democrats-only House outcome on a deadline-adjustment that could have waited."},"SB 5194":{"classification":"genuine","reasoning":"Unanimous bipartisan vote (98-0, 47-0); authorizes general obligation bonds essential to execute the state's capital budget — a standard fiscal instrument with hard bond-issuance timelines."},"SB 5195":{"classification":"genuine","reasoning":"Unanimous bipartisan vote (98-0, 47-0); the capital budget must be operative immediately for construction and infrastructure projects to proceed — standard for capital budgets to carry emergency clauses."},"SB 5303":{"classification":"genuine","reasoning":"Overwhelming bipartisan vote (94-1, 49-0); extends the Yakima River Basin Integrated Plan permit milestone before its June 30, 2025 statutory expiration — a hard deadline with no meaningful opposition and tribal/federal/state consensus."},"SB 5351":{"classification":"genuine","reasoning":"Unanimous bipartisan vote (94-0, 49-0); the EC was vetoed by the governor anyway, but the underlying bill fixed same-day dental claim denials tied to a July 1, 2025 date — bipartisan support and dental industry buy-in confirm no referendum-shield motive."},"SB 5357":{"classification":"genuine","reasoning":"Started unanimous (48-0) before narrowing on final (29-19); adjusts pension contribution rates effective July 1, 2025 — a hard fiscal deadline for employer contribution calculations that must be set before the biennium begins."},"SB 5506":{"classification":"genuine","reasoning":"Unanimous bipartisan vote (97-0, 49-0); delays the DCYF licensing deadline for residential private school dormitories from July 1, 2025 to July 1, 2026 — the immediate effect is required to prevent the prior deadline from triggering before rulemaking can be completed."},"SB 5557":{"classification":"shield","reasoning":"Strict party-line Senate vote (30-19) codifying EMTALA-based abortion-access requirements; while hospitals already comply with federal EMTALA, this state codification is a contested abortion-policy expansion that Republicans unanimously opposed and the EC prevents referendum on."},"SB 5577":{"classification":"genuine","reasoning":"Unanimous bipartisan vote (94-0, 48-0); requires Medicaid to cover all FDA-approved HIV antivirals without prior authorization effective July 1, 2025, aligning with an existing budget directive — no opposition and clear public health rationale."},"SB 5583":{"classification":"shield","reasoning":"Extremely close, near-party-line vote (51-46, 25-24) imposing 38% license fee increases with 770-892 public comments opposed; the EC prevents referendum on a deeply unpopular fee hike that passed by the thinnest possible margins."},"SB 5651":{"classification":"shield","reasoning":"Party-line vote (61-34, 33-15) doubling the garnishment exemption with organized creditor-industry opposition; the July 1, 2025 effective date is needed to prevent a prior sunset, but the partisan votes and organized opposition make the EC more shield than necessity."},"SB 5672":{"classification":"genuine","reasoning":"Unanimous bipartisan vote (96-0, 49-0); provides temporary relief from the 200-day post-hire certification deadline pending a performance audit — an immediate fix required to prevent workforce disruption in an ongoing staffing shortage."},"SB 5745":{"classification":"genuine","reasoning":"Senate unanimous (49-0) though House was narrower (59-37); clarifies mandatory appointed-counsel requirements for involuntary treatment detentions — addresses an active legal gap in the mental health commitment system requiring immediate resolution."},"SB 5752":{"classification":"shield","reasoning":"Party-line Senate vote (32-16, 87-10 House) delaying previously legislated child care expansions and cutting the Birth-to-Three ECEAP program, with extensive organized opposition from child care advocates; the EC prevents referendum on benefit roll-backs that voters would likely have challenged."},"SB 5785":{"classification":"shield","reasoning":"Strict party-line vote (55-43, 28-20) allowing universities to raise tuition above the statutory cap and cutting Washington College Grant aid for ~18,000 students; massive student and labor opposition with no time-sensitive deadline — the EC denies voters a referendum on an unpopular tuition hike."},"SB 5790":{"classification":"genuine","reasoning":"Broadly bipartisan (95-1, 37-10); changes the cost-of-living index for community/technical college employee COLAs effective July 1, 2025 — a genuine fiscal deadline since COLA calculations must be set before the biennium starts."},"SB 5794":{"classification":"shield","reasoning":"Strict party-line vote (53-45, 26-22) repealing multiple tax exemptions with massive business-coalition opposition including port/shipping, insurance, and retail groups; key provisions don't take effect until October 2025 or January 2026 — future effective dates with an EC is a clear shield."},"SB 5801":{"classification":"genuine","reasoning":"Some bipartisan support (31-18, 51-47 with 3-4 GOP crossovers); the EC applies only to specific fuel-tax sections effective June 30/July 1, 2025 — a hard fiscal-year deadline for tax rates that must be in place at the start of the fiscal year."},"SB 5802":{"classification":"genuine","reasoning":"Broadly bipartisan (63-35, 39-9); the EC covers specific bond-fund transfer provisions needed immediately to execute the transportation budget — a genuine fiscal execution necessity."},"SB 5813":{"classification":"shield","reasoning":"Mostly party-line vote (53-45, 27-21) imposing a new 2.9% surcharge on capital gains over $1 million and restructuring estate taxes; the primary tax provision is retroactive to January 1, 2025 but the EC on a new tax law passed on party lines with organized opposition is a referendum shield."},"SB 5814":{"classification":"shield","reasoning":"Near-party-line vote (50-47, 26-22) expanding retail sales tax to services like digital advertising, IT support, and staffing — massive organized business opposition and most provisions don't take effect until October 2025 or later; the EC prevents referendum on a sweeping tax expansion."},"SB 5855":{"classification":"shield","reasoning":"Strict party-line vote (56-37, 30-19) prohibiting law enforcement from wearing opaque face coverings, opposed by the WA Association of Sheriffs & Police Chiefs, WACOPS, and cities; politically motivated by immigration enforcement concerns, not an active public safety emergency."},"SB 5872":{"classification":"genuine","reasoning":"Near-unanimous vote (97-0 House, 46-3 Senate); creates a dedicated ECEAP donation account with the EC applying narrowly to allow the account to receive donations immediately without waiting 90 days — administrative necessity, no opposition."},"SB 5892":{"classification":"shield","reasoning":"Strict party-line vote (57-36, 29-19) restricting access to the voter registration database with criminal penalties, in direct response to Trump-era data requests; Republicans unanimously opposed and the EC prevents referendum on election-data access policy that voters might have reviewed."},"SB 5917":{"classification":"shield","reasoning":"Party-line vote (57-36, 32-17) expanding the Department of Corrections' authority to distribute abortion medications to the general public at no charge; Republicans unanimously opposed, no operational deadline existed, and the EC prevents referendum on a divisive abortion-access expansion."},"SB 5974":{"classification":"shield","reasoning":"Strict party-line vote (54-42, 30-19) creating state decertification power over elected sheriffs, with the entire Washington State Sheriffs' Association in opposition and marathon partisan debate; most provisions take effect April 30, 2026 or January 2027 — future effective dates with an EC is a clear shield."},"SB 5994":{"classification":"genuine","reasoning":"Near-unanimous bipartisan vote (96-0, 47-2); fixes a technical gap in timber-tax distribution calculations for school districts that failed levy elections, preventing immediate funding disruption to those schools."},"SB 5998":{"classification":"genuine","reasoning":"Despite party-line passage (54-43, 28-21), the supplemental operating budget is a required fiscal instrument making mid-biennium spending adjustments; government operations depend on immediate enactment and courts have historically upheld EC use for budget bills."},"SB 6002":{"classification":"genuine","reasoning":"Broadly bipartisan final vote (84-10, 39-10) creating strong privacy protections for license plate reader data; broad cross-party support, active federal pressure on state databases, and meaningful public-safety rationale justify immediate effect."},"SB 6003":{"classification":"genuine","reasoning":"Unanimous bipartisan vote (96-0, 49-0); supplemental capital budget appropriations must be operative immediately for projects to proceed — standard for capital budget bills."},"SB 6005":{"classification":"genuine","reasoning":"Broadly bipartisan (Senate 49-0; House 69-26 final); supplemental transportation budget appropriations require immediate effect to fund ongoing highway maintenance and safety programs."},"SB 6081":{"classification":"shield","reasoning":"Strict party-line Senate vote (30-19) protecting transgender sex-designation changes in government records from public disclosure; while privacy interests are real, this is a contested policy on gender identity that Republicans unanimously opposed — the EC prevents referendum on a polarizing records-transparency change."},"SB 6084":{"classification":"genuine","reasoning":"Near-unanimous bipartisan vote (93-0, 47-1); responds to a specific court decision (State v. Padrta) creating a legal loophole that allowed a double-voter to escape conviction — a genuine election-integrity fix requiring immediate closure."},"SB 6106":{"classification":"genuine","reasoning":"Broadly bipartisan (75-18, 48-0); requested by the Employment Security Department to fix a technical privacy issue in WARN Act layoff notices and exclude tribes from the statute — administrative necessity with no organized opposition."},"SB 6110":{"classification":"weak","reasoning":"Near-unanimous bipartisan vote (91-3, 42-7) but the EC applies only to convening a stakeholder work group — while a work group doesn't need emergency status, the narrow scope and bipartisan support mean this is weak rather than a deliberate shield."},"SB 6225":{"classification":"genuine","reasoning":"Senate unanimous (49-0); authorizes transportation bonds tied to the fiscal year and existing LEAP project documents — bond authorization must be operative before the State Finance Committee can act on capital projects."},"SB 6346":{"classification":"shield","reasoning":"Strict party-line vote (51-46, 27-22) creating Washington's first-ever income tax on earnings above $1 million — overriding a century of voter rejections (10 ballot defeats) with a 'necessity clause' that explicitly prevents referendum; the tax doesn't even take effect until January 2028, making this the most blatant referendum shield in the entire set."}};

    var LABELS = {
      genuine: 'Genuine Emergency',

    // Build a badge span for a given classification type
    function makeBadgeEl(cls, listSize) {
      if (!LABELS[cls]) return null;
      var span = document.createElement('span');
      span.className = 'ec-badge ec-badge--' + cls + (listSize ? ' ec-badge--list' : '');
      span.setAttribute('data-ec-badge', cls);
      var dot = document.createElement('span');
      dot.className = 'ec-badge__dot';
      span.appendChild(dot);
      span.appendChild(document.createTextNode(LABELS[cls]));
      return span;
    }

    // Build the detail block for a bill number
    function makeDetailBlock(billNum) {
      var info = window.__EC_CLASSIFICATIONS__[billNum];
      if (!info) return null;
      var cls = info.classification;
      if (!LABELS[cls]) return null;

      var block = document.createElement('div');
      block.className = 'ec-detail-block ec-detail-block--' + cls;
      block.setAttribute('data-ec-detail', billNum);

      var header = document.createElement('div');
      header.className = 'ec-detail-block__header';

      var badge = makeBadgeEl(cls, false);
      var label = document.createElement('span');
      label.className = 'ec-detail-block__label';
      label.textContent = 'EC Classification';

      header.appendChild(badge);
      header.appendChild(label);

      var reasoning = document.createElement('p');
      reasoning.className = 'ec-detail-block__reasoning';
      reasoning.textContent = info.reasoning;

      block.appendChild(header);
      block.appendChild(reasoning);
      return block;
    }

    // Extract bill number from text (e.g. "HB 1064" or "SB 5785")
    function extractBillNum(text) {
      var m = text && text.trim().match(/^(HB|SB)\s+(\d{4})$/);
      return m ? (m[1] + ' ' + m[2]) : null;
    }

    // Inject badges into the bill list (table view)
    function injectListBadges() {
      var links = document.querySelectorAll('a[data-testid^="link-bill-"]');
      links.forEach(function(link) {
        var billNum = extractBillNum(link.textContent);
        if (!billNum) return;

        var info = window.__EC_CLASSIFICATIONS__[billNum];
        if (!info) return;

        // Skip if badge already exists adjacent to this link
        if (link.nextElementSibling && link.nextElementSibling.hasAttribute('data-ec-badge')) return;

        var badge = makeBadgeEl(info.classification, true);
        if (badge) {
          badge.title = info.reasoning;
          if (link.nextSibling) {
            link.parentNode.insertBefore(badge, link.nextSibling);
          } else {
            link.parentNode.appendChild(badge);
          }
        }
      });
    }

    // Inject the classification block into a bill detail page

      if (!billNumEl) return;

      var billNum = billNumEl.textContent.trim();

      if (!info) return;

      // Check if the existing detail block is already for this bill
      var existing = document.querySelector('[data-ec-detail]');
      if (existing) {
        if (existing.getAttribute('data-ec-detail') === billNum) return; // Already correct
        existing.parentNode.removeChild(existing); // Remove stale block from previous bill
      }

      // Find the container: billNumEl -> headerDiv (h1+p) -> container (space-y-6)
      var headerDiv = billNumEl.parentElement;
      if (!headerDiv) return;
      var container = headerDiv.parentElement;
      if (!container) return;

      // Find the metadata row (flex row with year/chamber/sponsor pills)
      var metaRow = null;
      for (var i = 0; i < container.children.length; i++) {
        var sib = container.children[i];
        if (sib !== headerDiv && sib.querySelector && sib.querySelector('span[class*="px-2.5"]')) {
          metaRow = sib;
          break;
        }
      }

      var detailBlock = makeDetailBlock(billNum);
      if (!detailBlock) return;

      if (metaRow && metaRow.nextSibling) {
        container.insertBefore(detailBlock, metaRow.nextSibling);
      } else if (metaRow) {
        container.appendChild(detailBlock);
      } else {
        if (headerDiv.nextSibling) {
          container.insertBefore(detailBlock, headerDiv.nextSibling);
        } else {
          container.appendChild(detailBlock);
        }
      }
    }

    // Main injection runner
    var injectionTimer = null;

    function runInjection() {
      var hash = window.location.hash;
      var isDetail = /^#\/bills\/\d+/.test(hash);
      var isList = hash === '#/bills' || /^#\/bills\?/.test(hash) || hash === '' || hash === '#/';

      if (isDetail) {
        injectDetailBlock();
      } else if (isList) {
        injectListBadges();
      }
    }

    function scheduleInjection() {
      if (injectionTimer) clearTimeout(injectionTimer);
      injectionTimer = setTimeout(runInjection, 80);
    }

    // MutationObserver on #root to catch React renders
    var observer = new MutationObserver(function(mutations) {
      var relevant = mutations.some(function(m) {
        return m.addedNodes.length > 0;
      });
      if (relevant) scheduleInjection();
    });

    function startObserver() {
      var root = document.getElementById('root');
      if (root) {
        observer.observe(root, { childList: true, subtree: true });
        runInjection();
      } else {
        setTimeout(startObserver, 50);
      }
    }

    // Handle hash-based SPA navigation
    window.addEventListener('hashchange', function() {
      // Remove stale detail blocks on navigation away from detail pages
      var stale = document.querySelector('[data-ec-detail]');
      if (stale && !/^#\/bills\/\d+/.test(window.location.hash)) {
        stale.parentNode && stale.parentNode.removeChild(stale);
      }
      setTimeout(runInjection, 120);
      setTimeout(runInjection, 400);
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startObserver);
    } else {
      startObserver();
    }
  })();
  </script>
  </body>
</html>
